# Ops Pulse virtual host for Apache httpd 2.4 (RHEL 9 `httpd` package) — the alternative to
# deploy/nginx/ops-pulse.conf when the site standard is Apache. Same behaviour: SPA fallback,
# /api/ reverse proxy, compression, cache headers, security headers, request size limit.
#
# Install: copy to /etc/httpd/conf.d/ops-pulse.conf, copy the built SPA (apps/web/dist) to
# /var/www/ops-pulse, then:
#   dnf install -y httpd mod_ssl
#   setsebool -P httpd_can_network_connect 1     # let httpd reach the API on 127.0.0.1:3000
#   restorecon -Rv /var/www/ops-pulse
#   apachectl configtest && systemctl enable --now httpd
# Modules used (all in the RHEL 9 httpd package): mod_proxy, mod_proxy_http, mod_headers,
# mod_deflate, mod_dir, mod_unique_id.

Listen 8080

<VirtualHost *:8080>
    ServerName ops-pulse.local
    DocumentRoot /var/www/ops-pulse

    # Request size limit (bytes): the API only accepts small JSON bodies.
    LimitRequestBody 1048576
    ServerSignature Off

    ErrorLog  "|/usr/bin/logger -t ops-pulse-httpd -p local6.err"
    LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t\",\"remote\":\"%a\",\"request_id\":\"%{UNIQUE_ID}e\",\"method\":\"%m\",\"uri\":\"%U\",\"status\":%>s,\"bytes\":%B,\"duration_us\":%D}" ops_pulse_json
    CustomLog "logs/ops-pulse-access.log" ops_pulse_json

    # ---- REST API: reverse proxy, the API sets its own security headers (helmet) ----
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 30
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
    ProxyPass        /api/ http://127.0.0.1:3000/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    # ---- SPA ----
    <Directory /var/www/ops-pulse>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        # Unknown paths fall back to index.html so the client router handles them.
        FallbackResource /index.html
    </Directory>

    # Hashed Vite assets: one year, immutable. index.html: always revalidated.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header always set Cache-Control "no-cache"
    </LocationMatch>

    # Never serve dotfiles or source maps.
    <FilesMatch "(^\.|\.map$)">
        Require all denied
    </FilesMatch>

    # Compression
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml

    # ---- Security headers for the SPA (not for /api/, which helmet covers) ----
    <LocationMatch "^/(?!api/)">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "DENY"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </LocationMatch>
</VirtualHost>
