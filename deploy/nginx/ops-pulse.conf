# Ops Pulse virtual host: serves the SPA and reverse-proxies /api/ to the Express API.
# Included in the `http` context (container: deploy/nginx/nginx.conf; host: /etc/nginx/conf.d/).
#
# Host install (RHEL 9, Nginx outside Docker): change the upstream to 127.0.0.1:3000, listen on
# 443 with TLS, and allow Nginx to open network connections under SELinux:
#   setsebool -P httpd_can_network_connect 1
# See docs/ops/installation.md.

upstream ops_pulse_api {
    server api:3000;
    keepalive 16;
}

# Defense in depth on top of the API's own limit (5/min/IP on /auth/login).
limit_req_zone $binary_remote_addr zone=ops_pulse_login:10m rate=10r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/ops-pulse;
    index index.html;

    # Request size limit: the API only accepts small JSON bodies.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/xml text/xml application/manifest+json;

    # Liveness of the web tier itself (container HEALTHCHECK, load balancer).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API. Security headers come from the API (helmet); Nginx only forwards.
    location /api/ {
        proxy_pass http://ops_pulse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/v1/auth/login {
        limit_req zone=ops_pulse_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ops_pulse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed file names under /assets/: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/ops-pulse-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so the client router handles them.
    # index.html itself is never cached, so a deploy is picked up on the next load.
    location / {
        include /etc/nginx/snippets/ops-pulse-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps from the web root.
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
}
