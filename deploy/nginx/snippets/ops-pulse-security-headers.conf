# Security headers for the SPA responses (the API sets its own through helmet).
# Included per location because Nginx drops inherited add_header lines in any location that
# declares its own.
# CSP: the Vite build has no inline script; ECharts draws on <canvas> and sets inline styles,
# hence 'unsafe-inline' for styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Takes effect only over HTTPS (TLS terminates here or at the corporate load balancer).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
