# Main Nginx configuration for the ops-pulse web CONTAINER (UBI 9 nginx image, uid 1001).
# Runs unprivileged: listens on 8080, writes pid and temp files under /tmp so the root filesystem
# can be read-only. On a host install keep the distribution's nginx.conf and only drop
# ops-pulse.conf into /etc/nginx/conf.d/ (docs/ops/installation.md).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # One JSON object per line: the same shape the API logs (pino), easy to ship to a SIEM.
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
                                '"request_id":"$request_id","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
                                '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
