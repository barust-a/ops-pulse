# Ops Pulse — GitLab CI/CD (primary pipeline; .github/workflows/ci.yml mirrors the gates).
#
# Branch workflow (docs/agile/way-of-working.md):
#   feat/*, fix/*, chore/*  → merge request → main   (MR pipelines: lint, test, build)
#   main                    → images pushed, manual deploy to staging
#   tag vX.Y.Z on main      → release images, manual deploy to production
#
# Stages: lint → test → build → package → deploy. Jobs of an app only run when its files (or this
# file) change; main and release tags always run everything.

stages:
  - lint
  - test
  - build
  - package
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR runs the MR pipeline only, never a duplicate branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore)\//

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  NODE_IMAGE: node:22-bookworm
  UV_IMAGE: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  POSTGRES_IMAGE: postgres:16
  npm_config_cache: $CI_PROJECT_DIR/.npm
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_LINK_MODE: copy
  FF_USE_FASTZIP: "true"

# ---------------------------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------------------------

.release_rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.web_rules:
  rules:
    - !reference [.release_rules, rules]
    - changes:
        - apps/web/**/*
        - .gitlab-ci.yml

.api_rules:
  rules:
    - !reference [.release_rules, rules]
    - changes:
        - apps/api/**/*
        - db/migrations/**/*
        - .gitlab-ci.yml

.dataiku_rules:
  rules:
    - !reference [.release_rules, rules]
    - changes:
        - dataiku/**/*
        - .gitlab-ci.yml

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - $APP_DIR/package-lock.json
      prefix: npm-$APP_DIR
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - cd "$APP_DIR"
    - npm ci --prefer-offline --no-audit --no-fund

.web:
  extends: [.node, .web_rules]
  variables:
    APP_DIR: apps/web

.api:
  extends: [.node, .api_rules]
  variables:
    APP_DIR: apps/api

.dataiku:
  extends: .dataiku_rules
  image: $UV_IMAGE
  cache:
    key:
      files:
        - dataiku/uv.lock
      prefix: uv
    paths:
      - .uv-cache/
  before_script:
    - cd dataiku
    - uv sync --frozen
  after_script:
    - uv cache prune --ci || true

# ---------------------------------------------------------------------------------------------
# lint — static gates (ESLint --max-warnings=0, TypeScript strict, ruff, mypy, hygiene)
# ---------------------------------------------------------------------------------------------

agent-harness:
  stage: lint
  image: $NODE_IMAGE
  cache: []
  script:
    - node --test --test-reporter=spec --test-reporter=junit
      --test-reporter-destination=stdout --test-reporter-destination=harness-junit.xml
      "tools/agent-harness/*.test.mjs"
  artifacts:
    when: always
    reports:
      junit: harness-junit.xml

web:lint:
  extends: .web
  stage: lint
  script:
    - npm run lint
    - npm run typecheck
    - npm run hygiene

api:lint:
  extends: .api
  stage: lint
  script:
    - npm run lint
    - npm run typecheck
    - npm run hygiene

dataiku:lint:
  extends: .dataiku
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.10.0
  cache: []
  rules:
    - !reference [.release_rules, rules]
    - changes:
        - deploy/**/*
        - .husky/**/*
        - .gitlab-ci.yml
  script:
    - shellcheck -x deploy/scripts/*.sh
    - shellcheck --shell=sh .husky/pre-commit

compose:validate:
  stage: lint
  image: docker:27-cli
  cache: []
  rules:
    - !reference [.release_rules, rules]
    - changes:
        - deploy/**/*
        - .gitlab-ci.yml
  script:
    - docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example config --quiet
    - docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.prod.yml
      --env-file deploy/compose/.env.example config --quiet

# ---------------------------------------------------------------------------------------------
# test — unit/component tests with JUnit + coverage; API integration tests on a real PostgreSQL
# ---------------------------------------------------------------------------------------------

web:test:
  extends: .web
  stage: test
  needs: []
  script:
    # The coverage provider must match the installed vitest; --no-save keeps the lock file intact.
    - npm install --no-save --no-audit --no-fund
      "@vitest/coverage-v8@$(node -p "require('./node_modules/vitest/package.json').version")"
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      --coverage --coverage.reporter=text-summary --coverage.reporter=cobertura
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - apps/web/reports/
      - apps/web/coverage/
    reports:
      junit: apps/web/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/web/coverage/cobertura-coverage.xml

api:test:
  extends: .api
  stage: test
  needs: []
  script:
    # The coverage provider must match the installed vitest; --no-save keeps the lock file intact.
    - npm install --no-save --no-audit --no-fund
      "@vitest/coverage-v8@$(node -p "require('./node_modules/vitest/package.json').version")"
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      --coverage --coverage.reporter=text-summary --coverage.reporter=cobertura
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - apps/api/reports/
      - apps/api/coverage/
    reports:
      junit: apps/api/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml

api:test:integration:
  extends: .api
  stage: test
  needs: []
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_DB: ops_pulse_test
    POSTGRES_USER: ops_pulse
    # CI-only throwaway database password: the service lives for the duration of this job.
    POSTGRES_PASSWORD: ci-only-throwaway
    DATABASE_URL: postgres://ops_pulse:ci-only-throwaway@postgres:5432/ops_pulse_test
    MIGRATIONS_DIR: $CI_PROJECT_DIR/db/migrations
  script:
    - npm run test:integration -- --reporter=default --reporter=junit
      --outputFile.junit=reports/junit-integration.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - apps/api/reports/
    reports:
      junit: apps/api/reports/junit-integration.xml

dataiku:test:
  extends: .dataiku
  stage: test
  needs: []
  script:
    - uv run --frozen --with pytest-cov pytest --junitxml=reports/junit.xml
      --cov=python-lib --cov-report=term --cov-report=xml:reports/coverage.xml
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataiku/reports/
    reports:
      junit: dataiku/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: dataiku/reports/coverage.xml

# ---------------------------------------------------------------------------------------------
# build — production bundles (kept as artifacts; the images rebuild them from source)
# ---------------------------------------------------------------------------------------------

web:build:
  extends: .web
  stage: build
  needs: [web:lint, web:test]
  script:
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - apps/web/dist/

api:build:
  extends: .api
  stage: build
  needs: [api:lint, api:test, api:test:integration]
  script:
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - apps/api/dist/

# ---------------------------------------------------------------------------------------------
# package — Docker images (UBI 9) pushed to the project registry, then scanned
#   $CI_REGISTRY_IMAGE/<component>:<short sha>, :<branch slug>, and :<vX.Y.Z> on tags
# ---------------------------------------------------------------------------------------------

.docker:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  cache: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

image:build:
  extends: .docker
  stage: package
  rules:
    - !reference [.release_rules, rules]
  needs:
    - job: web:build
      artifacts: false
    - job: api:build
      artifacts: false
    - job: dataiku:test
      artifacts: false
  parallel:
    matrix:
      - COMPONENT: [api, web, kpi-job]
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$COMPONENT"
    - docker pull "$IMAGE:$CI_COMMIT_REF_SLUG" || true
    - >
      docker build
      --file "deploy/docker/$COMPONENT.Dockerfile"
      --cache-from "$IMAGE:$CI_COMMIT_REF_SLUG"
      --build-arg APP_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      --build-arg VCS_REF="$CI_COMMIT_SHA"
      --tag "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --tag "$IMAGE:$CI_COMMIT_REF_SLUG"
      .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi

image:scan:
  stage: package
  image:
    name: aquasec/trivy:0.56.2
    entrypoint: [""]
  cache: []
  rules:
    - !reference [.release_rules, rules]
  needs: [image:build]
  parallel:
    matrix:
      - COMPONENT: [api, web, kpi-job]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl"
      --output "trivy-$COMPONENT.json" "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_SHORT_SHA"
    # Fail the release on a fixable critical vulnerability.
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed
      "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_SHORT_SHA"
  artifacts:
    when: always
    reports:
      container_scanning: trivy-$COMPONENT.json

# ---------------------------------------------------------------------------------------------
# deploy — manual, over SSH, to RHEL 9 hosts running deploy/scripts/deploy.sh
#   Variables (masked/protected, per environment): DEPLOY_HOST, DEPLOY_USER,
#   DEPLOY_SSH_PRIVATE_KEY (file), DEPLOY_SSH_KNOWN_HOSTS (file).
#   The host is logged in to $CI_REGISTRY with a read-only deploy token (installation.md).
# ---------------------------------------------------------------------------------------------

.deploy:
  stage: deploy
  image: alpine:3.20
  cache: []
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client rsync
    - install -m 700 -d ~/.ssh
    - cp "$DEPLOY_SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - tr -d '\r' < "$DEPLOY_SSH_PRIVATE_KEY" | ssh-add -
  script:
    # Ship the deployment files of this commit (never the .env, which lives on the host only).
    - rsync -az --delete --exclude '.env' deploy/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/ops-pulse/deploy/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "/opt/ops-pulse/deploy/scripts/deploy.sh --tag $DEPLOY_TAG"

deploy_staging:
  extends: .deploy
  resource_group: staging
  environment:
    name: staging
    url: $STAGING_URL
  variables:
    DEPLOY_TAG: $CI_COMMIT_SHORT_SHA
  needs: [image:build, image:scan]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy_production:
  extends: .deploy
  resource_group: production
  environment:
    name: production
    url: $PRODUCTION_URL
  variables:
    DEPLOY_TAG: $CI_COMMIT_TAG
  needs: [image:build, image:scan]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
